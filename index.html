<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Bombe à désamorcer</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: radial-gradient(circle at center, #1a1a1a 0%, #000 100%);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-family: 'Courier New', monospace;
    overflow: hidden;
    position: relative;
  }

  /* Bombe */
  .bomb {
    width: 280px;
    height: 280px;
    background: radial-gradient(circle at 35% 35%, #4a4a4a, #1a1a1a 70%);
    border-radius: 50%;
    position: relative;
    box-shadow:
      inset -20px -20px 50px rgba(0,0,0,0.8),
      inset 20px 20px 50px rgba(255,255,255,0.05),
      0 0 60px rgba(255, 0, 0, 0.3);
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .bomb::before {
    content: '';
    position: absolute;
    top: -25px;
    left: 50%;
    transform: translateX(-50%);
    width: 30px;
    height: 50px;
    background: linear-gradient(180deg, #6b4423, #3d2817);
    border-radius: 4px 4px 0 0;
  }

  .fuse {
    position: absolute;
    top: -75px;
    left: 50%;
    width: 6px;
    height: 50px;
    background: repeating-linear-gradient(
      45deg,
      #8b6914,
      #8b6914 4px,
      #5a4308 4px,
      #5a4308 8px
    );
    transform: translateX(-50%);
    border-radius: 3px;
  }

  .spark {
    position: absolute;
    top: -90px;
    left: 50%;
    transform: translateX(-50%);
    width: 20px;
    height: 20px;
    background: radial-gradient(circle, #fff700, #ff6b00, #ff0000);
    border-radius: 50%;
    box-shadow: 0 0 30px #ff6b00, 0 0 50px #ff0000;
    animation: flicker 0.15s infinite alternate;
  }

  @keyframes flicker {
    0% { transform: translateX(-50%) scale(1); opacity: 1; }
    100% { transform: translateX(-50%) scale(1.3); opacity: 0.8; }
  }

  .timer {
    font-size: 56px;
    font-weight: bold;
    color: #ff0000;
    text-shadow: 0 0 20px #ff0000, 0 0 40px #ff0000;
    font-family: 'Courier New', monospace;
    letter-spacing: 4px;
    z-index: 2;
  }

  .timer.warning {
    color: #ffff00;
    text-shadow: 0 0 20px #ffff00, 0 0 40px #ff6600;
    animation: pulse 0.3s infinite alternate;
  }

  @keyframes pulse {
    0% { transform: scale(1); }
    100% { transform: scale(1.15); }
  }

  /* Bouton de départ */
  .start-btn {
    background: linear-gradient(135deg, #ff0000, #8b0000);
    color: white;
    border: 3px solid #ff6666;
    padding: 20px 50px;
    font-size: 24px;
    font-weight: bold;
    border-radius: 8px;
    cursor: pointer;
    text-transform: uppercase;
    letter-spacing: 3px;
    box-shadow: 0 0 30px rgba(255, 0, 0, 0.6);
    transition: all 0.2s;
    font-family: 'Courier New', monospace;
  }

  .start-btn:hover {
    transform: scale(1.05);
    box-shadow: 0 0 50px rgba(255, 0, 0, 0.9);
  }

  /* Bouton désamorcer */
  .defuse-btn {
    margin-top: 40px;
    background: linear-gradient(135deg, #00aa00, #006600);
    color: white;
    border: 3px solid #00ff00;
    padding: 18px 45px;
    font-size: 20px;
    font-weight: bold;
    border-radius: 8px;
    cursor: pointer;
    text-transform: uppercase;
    letter-spacing: 2px;
    box-shadow: 0 0 30px rgba(0, 255, 0, 0.5);
    transition: all 0.2s;
    font-family: 'Courier New', monospace;
    display: none;
  }

  .defuse-btn:hover {
    transform: scale(1.05);
    box-shadow: 0 0 50px rgba(0, 255, 0, 0.8);
  }

  .defuse-btn:active {
    transform: scale(0.95);
  }

  /* Message final */
  .message {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%) scale(0);
    font-size: 60px;
    font-weight: bold;
    text-align: center;
    z-index: 100;
    opacity: 0;
    transition: all 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
    text-shadow: 0 0 30px currentColor;
    padding: 20px;
  }

  .message.show {
    transform: translate(-50%, -50%) scale(1);
    opacity: 1;
  }

  .message.success { color: #00ff00; }
  .message.fail { color: #ff0000; }

  /* Conteneur */
  .container {
    display: flex;
    flex-direction: column;
    align-items: center;
    transition: opacity 0.3s;
  }

  /* Shake */
  @keyframes shake {
    0%, 100% { transform: translate(0, 0) rotate(0deg); }
    10% { transform: translate(-5px, -3px) rotate(-1deg); }
    20% { transform: translate(5px, 3px) rotate(1deg); }
    30% { transform: translate(-4px, 4px) rotate(-1deg); }
    40% { transform: translate(4px, -4px) rotate(1deg); }
    50% { transform: translate(-3px, 3px) rotate(-1deg); }
    60% { transform: translate(3px, -3px) rotate(1deg); }
    70% { transform: translate(-2px, 2px) rotate(-1deg); }
    80% { transform: translate(2px, -2px) rotate(1deg); }
    90% { transform: translate(-1px, 1px) rotate(0deg); }
  }

  .shake { animation: shake 0.3s infinite; }
  .shake-strong { animation: shake 0.1s infinite; }

  /* Explosion */
  .explosion {
    position: fixed;
    top: 50%;
    left: 50%;
    width: 50px;
    height: 50px;
    border-radius: 50%;
    background: radial-gradient(circle, #fff 0%, #ffeb3b 20%, #ff9800 40%, #ff5722 60%, #d32f2f 80%, transparent 100%);
    transform: translate(-50%, -50%) scale(0);
    z-index: 50;
    pointer-events: none;
  }

  .explosion.boom {
    animation: explode 1s ease-out forwards;
  }

  @keyframes explode {
    0% { transform: translate(-50%, -50%) scale(0); opacity: 1; }
    50% { transform: translate(-50%, -50%) scale(60); opacity: 1; }
    100% { transform: translate(-50%, -50%) scale(80); opacity: 0; }
  }

  /* Particules */
  .particle {
    position: fixed;
    width: 8px;
    height: 8px;
    border-radius: 50%;
    pointer-events: none;
    z-index: 40;
  }

  /* Flash blanc */
  .flash {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background: white;
    opacity: 0;
    pointer-events: none;
    z-index: 30;
  }

  .flash.active {
    animation: flashAnim 0.3s ease-out;
  }

  @keyframes flashAnim {
    0% { opacity: 0; }
    20% { opacity: 1; }
    100% { opacity: 0; }
  }

  /* Confettis pour victoire */
  .confetti {
    position: fixed;
    width: 10px;
    height: 10px;
    pointer-events: none;
    z-index: 40;
  }

  .hidden { display: none !important; }

  /* Instructions */
  .instructions {
    color: #888;
    margin-top: 30px;
    font-size: 14px;
    text-align: center;
    max-width: 400px;
    line-height: 1.6;
  }
</style>
</head>
<body>

<div class="container" id="container">
  <button class="start-btn" id="startBtn" onclick="startBomb()">⚠ Armer la bombe ⚠</button>
  <p class="instructions">Tu auras 10 secondes pour désamorcer en cliquant <strong style="color:#0f0">5 fois</strong> sur le bouton vert.</p>
</div>

<div class="container hidden" id="bombContainer">
  <div class="bomb" id="bomb">
    <div class="fuse"></div>
    <div class="spark" id="spark"></div>
    <div class="timer" id="timer">10.00</div>
  </div>
  <button class="defuse-btn" id="defuseBtn" onclick="defuse()">
    Désamorcer (<span id="clicksLeft">5</span>)
  </button>
</div>

<div class="flash" id="flash"></div>
<div class="explosion" id="explosion"></div>
<div class="message" id="message"></div>

<script>
  let timeLeft = 10;
  let clicksNeeded = 5;
  let interval = null;
  let gameOver = false;

  const timerEl = document.getElementById('timer');
  const bombEl = document.getElementById('bomb');
  const defuseBtn = document.getElementById('defuseBtn');
  const clicksLeftEl = document.getElementById('clicksLeft');
  const messageEl = document.getElementById('message');
  const flashEl = document.getElementById('flash');
  const explosionEl = document.getElementById('explosion');
  const sparkEl = document.getElementById('spark');

  // Sons via Web Audio API
  let audioCtx;
  function beep(freq, duration, type = 'square', volume = 0.1) {
    try {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.type = type;
      osc.frequency.value = freq;
      gain.gain.setValueAtTime(volume, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
      osc.start();
      osc.stop(audioCtx.currentTime + duration);
    } catch (e) {}
  }

  function explosionSound() {
    try {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      const bufferSize = audioCtx.sampleRate * 1.5;
      const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
      const data = buffer.getChannelData(0);
      for (let i = 0; i < bufferSize; i++) {
        data[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / bufferSize, 2);
      }
      const noise = audioCtx.createBufferSource();
      noise.buffer = buffer;
      const gain = audioCtx.createGain();
      gain.gain.setValueAtTime(0.5, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 1.5);
      const filter = audioCtx.createBiquadFilter();
      filter.type = 'lowpass';
      filter.frequency.value = 800;
      noise.connect(filter);
      filter.connect(gain);
      gain.connect(audioCtx.destination);
      noise.start();
    } catch (e) {}
  }

  function startBomb() {
    document.getElementById('container').classList.add('hidden');
    document.getElementById('bombContainer').classList.remove('hidden');
    defuseBtn.style.display = 'block';

    interval = setInterval(tick, 50);
  }

  function tick() {
    if (gameOver) return;
    timeLeft -= 0.05;

    if (timeLeft <= 0) {
      timerEl.textContent = '00.00';
      explode();
      return;
    }

    timerEl.textContent = timeLeft.toFixed(2);

    // Bip au passage de chaque seconde
    if (Math.floor(timeLeft * 20) % 20 === 0) {
      const pitch = timeLeft < 3 ? 1200 : timeLeft < 6 ? 900 : 700;
      beep(pitch, 0.08);
    }

    // Effets selon le temps restant
    if (timeLeft < 3) {
      timerEl.classList.add('warning');
      bombEl.classList.remove('shake');
      bombEl.classList.add('shake-strong');
      sparkEl.style.animationDuration = '0.05s';
    } else if (timeLeft < 6) {
      bombEl.classList.add('shake');
      sparkEl.style.animationDuration = '0.1s';
    }
  }

  function defuse() {
    if (gameOver) return;
    clicksNeeded--;
    beep(1500, 0.05, 'sine', 0.15);

    // Effet de feedback
    defuseBtn.style.transform = 'scale(0.9)';
    setTimeout(() => defuseBtn.style.transform = '', 100);

    if (clicksNeeded <= 0) {
      success();
    } else {
      clicksLeftEl.textContent = clicksNeeded;
    }
  }

  function success() {
    gameOver = true;
    clearInterval(interval);
    bombEl.classList.remove('shake', 'shake-strong');
    timerEl.classList.remove('warning');
    sparkEl.style.display = 'none';

    // Son de victoire
    setTimeout(() => beep(523, 0.15, 'sine', 0.2), 0);
    setTimeout(() => beep(659, 0.15, 'sine', 0.2), 150);
    setTimeout(() => beep(784, 0.3, 'sine', 0.2), 300);

    // Confettis
    for (let i = 0; i < 100; i++) {
      createConfetti();
    }

    setTimeout(() => {
      messageEl.textContent = '✓ DÉSAMORCÉE — bien joué trou de balle';
      messageEl.classList.add('show', 'success');
    }, 400);
  }

  function explode() {
    gameOver = true;
    clearInterval(interval);

    // Flash
    flashEl.classList.add('active');

    // Son
    explosionSound();

    // Explosion visuelle
    explosionEl.classList.add('boom');

    // Cacher la bombe
    bombEl.style.opacity = '0';
    defuseBtn.style.display = 'none';

    // Particules
    for (let i = 0; i < 60; i++) {
      createParticle();
    }

    // Shake écran
    document.body.style.animation = 'shake 0.5s';

    setTimeout(() => {
      messageEl.textContent = '💥 TOO LATE trou de balle 💥';
      messageEl.classList.add('show', 'fail');
    }, 600);
  }

  function createParticle() {
    const particle = document.createElement('div');
    particle.className = 'particle';
    const colors = ['#ff0000', '#ff6600', '#ffaa00', '#ffff00', '#ff3300'];
    particle.style.background = colors[Math.floor(Math.random() * colors.length)];
    particle.style.boxShadow = `0 0 10px ${particle.style.background}`;
    particle.style.left = '50%';
    particle.style.top = '50%';
    document.body.appendChild(particle);

    const angle = Math.random() * Math.PI * 2;
    const velocity = 300 + Math.random() * 500;
    const dx = Math.cos(angle) * velocity;
    const dy = Math.sin(angle) * velocity;

    particle.animate([
      { transform: 'translate(-50%, -50%) scale(1)', opacity: 1 },
      { transform: `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px)) scale(0)`, opacity: 0 }
    ], {
      duration: 1000 + Math.random() * 500,
      easing: 'cubic-bezier(0.1, 0.5, 0.5, 1)'
    });

    setTimeout(() => particle.remove(), 1500);
  }

  function createConfetti() {
    const confetti = document.createElement('div');
    confetti.className = 'confetti';
    const colors = ['#00ff00', '#00ffaa', '#ffff00', '#ffffff', '#00aaff'];
    confetti.style.background = colors[Math.floor(Math.random() * colors.length)];
    confetti.style.left = (50 + (Math.random() - 0.5) * 30) + '%';
    confetti.style.top = '50%';
    confetti.style.width = (5 + Math.random() * 8) + 'px';
    confetti.style.height = (5 + Math.random() * 8) + 'px';
    document.body.appendChild(confetti);

    const angle = -Math.PI / 2 + (Math.random() - 0.5) * Math.PI;
    const velocity = 200 + Math.random() * 400;
    const dx = Math.cos(angle) * velocity;
    const dy = Math.sin(angle) * velocity;
    const rotation = Math.random() * 720;

    confetti.animate([
      { transform: 'translate(-50%, -50%) rotate(0deg)', opacity: 1 },
      { transform: `translate(calc(-50% + ${dx}px), calc(-50% + ${dy + 400}px)) rotate(${rotation}deg)`, opacity: 0 }
    ], {
      duration: 2000 + Math.random() * 1000,
      easing: 'cubic-bezier(0.1, 0.5, 0.5, 1)'
    });

    setTimeout(() => confetti.remove(), 3000);
  }
</script>

</body>
</html>
