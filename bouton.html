<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Bouton</title>
<style>
  body {
    background-color: white;
    height: 100vh;
    margin: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-family: Arial, sans-serif;
  }
  button {
    background-color: red;
    color: white;
    border: none;
    padding: 15px 30px;
    font-size: 18px;
    border-radius: 6px;
    cursor: pointer;
  }
  button:hover {
    background-color: darkred;
  }
  #message {
    margin-top: 20px;
    font-size: 20px;
    color: black;
  }
</style>
</head>
<body>
  <button onclick="document.getElementById('message').textContent = 'bien joué trou de balle va'">
    Cliquez ici
  </button>
  <p id="message"></p>
</body>
</html>
